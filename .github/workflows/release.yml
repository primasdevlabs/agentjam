name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in \
            linux/amd64 linux/arm64 \
            darwin/amd64 darwin/arm64 \
            windows/amd64 windows/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            NAME="agentjam-v${VERSION}-${GOOS}-${GOARCH}"
            OUT="agentjam"
            if [ "$GOOS" = "windows" ]; then
              OUT="agentjam.exe"
              CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -o "dist/${NAME}/${OUT}" ./cmd/agentjam
              (cd "dist/${NAME}" && zip -q "../${NAME}.zip" "$OUT")
            else
              CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -o "dist/${NAME}/${OUT}" ./cmd/agentjam
              tar -czf "dist/${NAME}.tar.gz" -C "dist/${NAME}" "$OUT"
            fi
          done
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt

      - name: Attach binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: false
