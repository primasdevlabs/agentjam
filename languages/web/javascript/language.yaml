id: lang-javascript
name: JavaScript
ecosystem: web
aliases: [js, jsx, node]
extensions: [.js, .jsx, .mjs, .cjs]

tooling:
  package_manager: npm
  linter: eslint
  formatter: prettier
  type_checker: tsc

framework_precedence:
  - react
  - vue
  - node

documentation:
  official_site: https://developer.mozilla.org/docs/Web/JavaScript
