name: claude-code-integration
harness: claude-code
description: Target harness integration adapter for Claude Code.
version: 1.0.0

capabilities:
  supportsAgents: true
  supportsSkills: true
  supportsWorkflows: true
  supportsTools: true

mapping:
  instructionFormat: markdown
  fileNamingConvention: "CLAUDE.md"
  toolCallStyle: native-claude-tools

limitations:
  - Requires Claude Code CLI v0.2+
