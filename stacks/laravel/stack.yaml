profile: laravel-production
version: 1.0.0
description: Production stack profile for Laravel 11/12, PHP 8.3+, Eloquent, Pest/PHPUnit, and Pint.

stack:
  language:
    name: php
    version: "8.3+"
    version_policy: current-stable
  backend:
    framework: laravel
    version: "11.x"
    version_policy: latest-compatible
  package_manager: composer
  testing: pest
  linting: pint
  formatting: pint

sources:
  - https://laravel.com/docs
  - https://pestphp.com

dependencies:
  allowed:
    - laravel/framework
    - laravel/sanctum
    - pestphp/pest
  forbidden:
    - codeigniter/framework
    - symfony/symfony

validation:
  commands:
    lint: "./vendor/bin/pint --test"
    test: "./vendor/bin/pest"
