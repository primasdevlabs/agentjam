name: laravel
version: 1.0.0
type: stack
description: Stack profile for modern Laravel 11/12 applications (modular monolith, Inertia.js / Blade, Pest testing, Laravel Pint formatting).
framework: Laravel
ecosystem: backend
defaults:
  language: php
  package_manager: composer
  linter: pint
  test_runner: pest
  style_system: tailwind
conventions:
  architecture: modular-monolith
  api: form-requests
  database: eloquent-orm
