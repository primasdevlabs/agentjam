name: nextjs
version: 1.0.0
type: stack
description: Stack profile for Next.js App Router applications, establishing conventions for React 19, Server Components, Route Handlers, and Tailwind CSS / CSS Modules.
framework: Next.js
ecosystem: web
defaults:
  language: typescript
  package_manager: pnpm
  linter: biome
  test_runner: vitest
  style_system: css-modules
conventions:
  router: app-router
  api: route-handlers
  rendering: server-components
