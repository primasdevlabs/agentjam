name: nestjs
version: 1.0.0
type: stack
description: Stack profile for NestJS enterprise TypeScript backend applications (Prisma / TypeORM, Jest / Vitest, Class Validator).
framework: NestJS
ecosystem: backend
defaults:
  language: typescript
  package_manager: npm
  linter: eslint
  test_runner: jest
  style_system: none
conventions:
  architecture: modular-clean-architecture
  api: controllers-and-dtos
  validation: class-validator
