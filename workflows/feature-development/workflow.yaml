name: feature-development
version: 1.0.0
type: workflow
description: End-to-end workflow for designing, implementing, testing, and reviewing a new software feature.
mode: multi-agent
agents:
  - researcher
  - software-engineer
  - qa-engineer
  - code-reviewer
steps:
  - id: step-1
    name: Context & Research
    agent: researcher
    description: Fetch documentation and inspect active project conventions.
  - id: step-2
    name: Feature Implementation
    agent: software-engineer
    description: Write production code according to modularity and security policies.
  - id: step-3
    name: Test Automation
    agent: qa-engineer
    description: Write unit and integration tests covering feature code.
  - id: step-4
    name: Code Review
    agent: code-reviewer
    description: Audit feature implementation against AgentJam policies.
inputs:
  - feature-spec
outputs:
  - pull-request
